<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FBI — Case File Access Terminal</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Case-file palette — dark room, single desk lamp */
            --bg:       #0b0a08;
            --surface:  #17140f;
            --surface2: #1e1a13;
            --border:   #3a3226;
            --border2: #2a2419;
            --text:     #ece4d3;
            --text2:    #a89b7d;
            --text3:    #6b6047;

            /* Brass / gold accent — the stamp ink */
            --fbi:      #c9a24d;
            --fbi-dark: #8f7433;
            --fbi-light:#e0bd6e;
            --fbi-glow: rgba(201,162,77,0.16);

            --danger:   #a4372f;
            --warning:  #b5842c;
            --success:  #55794f;
            --mono:     'IBM Plex Mono', monospace;
            --sans:     'IBM Plex Sans', sans-serif;
            --display:  'Special Elite', 'IBM Plex Mono', monospace;

            --radius: 2px;
            --shadow: 0 1px 0 rgba(0,0,0,0.5), 0 2px 10px rgba(0,0,0,0.45);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.55);
            --shadow-lg: 0 20px 48px rgba(0,0,0,0.65);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background:
                radial-gradient(1100px 500px at 50% -8%, rgba(201,162,77,0.07), transparent 60%),
                var(--bg);
            color: var(--text); font-family: var(--sans); height: 100vh; width: 100vw; overflow: hidden; font-size: 14px;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ── Typography ── */
        .mono   { font-family: var(--mono); }
        .display{ font-family: var(--display); letter-spacing: 0.03em; }

        /* ── Animations ── */
        @keyframes fadeIn  { from { opacity:0 } to { opacity:1 } }
        @keyframes fadeUp  { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:translateY(0) } }
        @keyframes slideR  { from { opacity:0; transform:translateX(-12px) } to { opacity:1; transform:translateX(0) } }
        @keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:.4} }
        @keyframes spin    { to{transform:rotate(360deg)} }
        @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }

        .fade-in  { animation: fadeIn  .35s ease both }
        .fade-up  { animation: fadeUp  .4s ease both }
        .slide-r  { animation: slideR  .3s ease both }

        .spin { animation: spin 1s linear infinite }

        /* ── Cards & Surfaces ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .card-inset {
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 18px; border-radius: var(--radius); border: none; cursor: pointer;
            font-family: var(--sans); font-weight: 600; font-size: 0.82rem;
            letter-spacing: 0.04em; transition: all .18s ease; white-space: nowrap;
        }
        .btn-primary-fbi { background: var(--fbi); color: #16130c; }
        .btn-primary-fbi:hover { background: var(--fbi-light); box-shadow: 0 4px 14px rgba(201,162,77,.35); }
        .btn-outline { background: transparent; color: var(--text2); border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--surface2); border-color: var(--text3); }
        .btn-ghost  { background: transparent; color: var(--text2); border: none; padding: 8px 12px; }
        .btn-ghost:hover  { background: var(--surface2); }
        .btn-danger { background: var(--danger); color: #f4e9e4; }
        .btn-danger:hover { background: #8a2c25; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; }
        .btn-xs { padding: 4px 8px; font-size: 0.7rem; }

        /* ── Form inputs ── */
        .input {
            width: 100%; padding: 10px 14px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius); font-family: var(--sans); font-size: 0.85rem;
            color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s;
        }
        .input:focus { border-color: var(--fbi); box-shadow: 0 0 0 3px var(--fbi-glow); }
        .input::placeholder { color: var(--text3); }
        select.input option { background: var(--surface2); color: var(--text); }
        textarea.input { resize: none; }
        .label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text2); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }

        /* ── Badges (redaction-stamp style) ── */
        .badge { display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:2px;font-family:var(--mono);font-size:0.62rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase; }
        .badge-open    { background:rgba(164,55,47,0.14);color:#d98f86;border:1px solid rgba(164,55,47,0.4); }
        .badge-closed  { background:rgba(85,121,79,0.14);color:#a3c49c;border:1px solid rgba(85,121,79,0.4); }
        .badge-pending { background:rgba(181,132,44,0.14);color:#dfb567;border:1px solid rgba(181,132,44,0.4); }
        .badge-fbi     { background:rgba(201,162,77,0.12);color:var(--fbi-light);border:1px solid rgba(201,162,77,0.4); }
        .badge-blue    { background:rgba(201,162,77,0.12);color:var(--fbi-light);border:1px solid rgba(201,162,77,0.35); }

        /* ── Table rows ── */
        .data-row {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 14px 16px; border-bottom: 1px solid var(--border2);
            transition: background .15s;
        }
        .data-row:last-child { border-bottom: none; }
        .data-row:hover { background: var(--surface2); }

        /* ── Nav (folder tabs) ── */
        .nav-tab {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 8px 6px; cursor: pointer; border-radius: 4px 4px 0 0;
            transition: all .15s; position: relative; min-width: 48px;
        }
        .nav-tab span { font-size: 0.5rem; font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
        .nav-tab i { font-size: 1rem; }
        .nav-tab.active-fbi   { color: var(--fbi-light); background: var(--surface2); }
        .nav-tab.inactive { color: var(--text3); }
        .nav-tab.active-fbi::after {
            content: ''; position: absolute; bottom: -10px; left: 20%; width: 60%; height: 2px; border-radius: 2px 2px 0 0;
        }
        .nav-tab.active-fbi::after   { background: var(--fbi); }

        /* ── Status dot ── */
        .dot { width:7px;height:7px;border-radius:50%;display:inline-block; }
        .dot-green  { background:#5fae5a;box-shadow:0 0 0 0 rgba(95,174,90,.5);animation:dotPulse 2s ease-in-out infinite; }
        .dot-red    { background:#c0554b; }
        .dot-orange { background:#d9a13e; }
        @keyframes dotPulse { 0%{box-shadow:0 0 0 0 rgba(95,174,90,.5)}70%{box-shadow:0 0 0 5px rgba(95,174,90,0)}100%{box-shadow:0 0 0 0 rgba(95,174,90,0)} }

        /* ── Modal ── */
        .modal-backdrop {
            position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
            z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;
            animation:fadeIn .2s ease;
        }
        .modal-box {
            background:var(--surface);border:1px solid var(--border);border-radius:4px;
            width:100%;max-width:480px;max-height:90vh;overflow-y:auto;
            box-shadow:var(--shadow-lg);animation:fadeUp .25s ease;
        }
        .modal-header { padding:20px 24px 16px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center; }
        .modal-body   { padding:20px 24px; }
        .modal-footer { padding:16px 24px;border-top:1px solid var(--border2);display:flex;gap:10px;justify-content:flex-end; }

        /* ── Top bar ── */
        .topbar { background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;box-shadow:var(--shadow); }

        /* ── Sector strip ── */
        .sector-strip-fbi   { background:var(--fbi);height:3px;width:100%; }

        /* ── Stat card ── */
        .stat-card { padding:16px;display:flex;flex-direction:column;gap:4px; }
        .stat-val   { font-family:var(--display);font-size:1.9rem;line-height:1; }
        .stat-label { font-size:0.65rem;font-family:var(--mono);letter-spacing:0.12em;text-transform:uppercase;color:var(--text3); }

        /* ── Progress ── */
        .progress-track { height:4px;background:var(--border2);border-radius:2px;overflow:hidden; }
        .progress-fill  { height:100%;border-radius:2px;transition:width 1s ease; }

        /* ── Divider ── */
        .divider { border:none;border-top:1px solid var(--border2);margin:14px 0; }

        /* ── Alert banner ── */
        .alert { padding:12px 16px;border-radius:var(--radius);border-left:4px solid;margin-bottom:10px; }
        .alert-info    { background:rgba(201,162,77,0.08);border-color:var(--fbi);color:var(--fbi-light); }
        .alert-warning { background:rgba(181,132,44,0.08);border-color:var(--warning);color:#dfb567; }
        .alert-danger  { background:rgba(164,55,47,0.1);border-color:var(--danger);color:#d98f86; }
        .alert-success { background:rgba(85,121,79,0.1);border-color:var(--success);color:#a3c49c; }

        /* ── Home hero ── */
        .gov-header {
            background: radial-gradient(900px 400px at 50% -20%, rgba(201,162,77,0.10), transparent 65%), linear-gradient(180deg, #100e0a 0%, #0b0a08 100%);
            color: white; padding: 56px 24px 48px; text-align: center; position: relative; overflow: hidden;
            border-bottom: 1px solid var(--border);
        }
        /* Signature: the classified stamp, canted in the corner of the first thing you see */
        .gov-header::before {
            content: 'CLASSIFIED — EYES ONLY';
            position: absolute; top: 22px; right: -46px;
            transform: rotate(28deg);
            font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.2em;
            color: rgba(164,55,47,0.75); border: 1.5px solid rgba(164,55,47,0.65);
            padding: 3px 52px; white-space: nowrap; pointer-events: none;
        }

        /* ── Log entry ── */
        .log-entry { padding:8px 16px;border-bottom:1px solid var(--border2);font-family:var(--mono);font-size:0.68rem;color:var(--text2); }
        .log-time  { color:var(--text3); }
        .log-user  { font-weight:600; }

        /* ── Wanted card ── */
        .wanted-photo { width:100%;height:160px;object-fit:cover;border-bottom:3px solid var(--danger);display:block;filter:saturate(0.85) contrast(1.05); }

        /* ── Unit card ── */
        .unit-item { padding:10px 14px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center; }
        .unit-item:last-child { border-bottom:none; }

        /* home page sector card — looks like a folder front cover */
        .sector-choice {
            border: 1px solid var(--border); border-radius: 3px; padding: 32px 24px;
            cursor: pointer; transition: all .2s ease; text-align: center;
            background: var(--surface); position: relative;
        }
        .sector-choice::before {
            content: ''; position: absolute; top: 0; left: 24px; width: 64px; height: 6px;
            background: var(--surface2); border: 1px solid var(--border); border-top: none; border-radius: 0 0 3px 3px;
        }
        .sector-choice:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--fbi); }
    </style>
</head>
<body>
<div id="root"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, setDoc, doc, deleteDoc, query, orderBy, addDoc, updateDoc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:"AIzaSyCYgffN2dA7IILMbI2i_1YfERkKWIrpHyA",
        authDomain:"ek-police.firebaseapp.com",
        projectId:"ek-police",
        storageBucket:"ek-police.firebasestorage.app",
        messagingSenderId:"300605258409",
        appId:"1:300605258409:web:f265025ffa5592f651c7b8"
    };
    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);
    window.fbDB    = db;
    window.fbTools = { collection, onSnapshot, setDoc, doc, deleteDoc, query, orderBy, addDoc, updateDoc, serverTimestamp, getDoc };
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ═══════════════════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════════════════ */
const FBI_RANKS = [
    "Director","Deputy Director","Associate Deputy Director",
    "Executive Assistant Director","Assistant Director",
    "Deputy Assistant Director","Special Agent in Charge (SAC)",
    "Assistant Special Agent in Charge (ASAC)",
    "Supervisory Special Agent (SSA)","Senior Special Agent","Special Agent"
];

// Top 3 ranks = privileged (command access)
const FBI_COMMAND_RANKS  = ["Director","Deputy Director","Associate Deputy Director"];

const FBI_LOGO = "https://upload.wikimedia.org/wikipedia/commons/d/da/Seal_of_the_Federal_Bureau_of_Investigation.svg";

const MAP_URL_FBI = 'https://github.com/salmAlzaabi/FBI/blob/main/IMG_2479.jpg?raw=true';

/* ═══════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════ */
const getSector = (email='') => {
    if (email.toLowerCase().endsWith('@fbi.gov')) return 'fbi';
    return null;
};

const isCommandRank = (sector, rank) => {
    if (!rank) return false;
    if (sector === 'fbi') return FBI_COMMAND_RANKS.includes(rank) || rank === 'Director';
    return false;
};

/* ═══════════════════════════════════════════════════════
   SHARED TINY COMPONENTS
═══════════════════════════════════════════════════════ */
const Spinner = () => <i className="fas fa-circle-notch spin" style={{fontSize:'1.1rem',color:'inherit'}}/>;
const Dot = ({status}) => <span className={`dot dot-${status}`}/>;
const Divider = () => <hr className="divider"/>;

const Empty = ({icon, text}) => (
    <div style={{textAlign:'center',padding:'48px 20px',color:'var(--text3)'}}>
        <i className={`fas ${icon}`} style={{fontSize:'2rem',display:'block',marginBottom:12,opacity:.3}}/>
        <p className="mono" style={{fontSize:'0.7rem',letterSpacing:'0.15em'}}>{text}</p>
    </div>
);

const FormField = ({label, children}) => (
    <div style={{display:'flex',flexDirection:'column',gap:4}}>
        <label className="label">{label}</label>
        {children}
    </div>
);

/* ═══════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════ */
const App = () => {
    const [screen, setScreen] = useState('home'); // home | login | fbi
    const [currentUser, setCurrentUser] = useState(null);
    const [loginError, setLoginError] = useState('');
    const [loginLoading, setLoginLoading] = useState(false);
    const [loginSector, setLoginSector] = useState(null); // detected sector during login

    // Shared Firestore data
    const [fbiUsers,     setFbiUsers]     = useState([]);
    const [fbiCases,     setFbicases]     = useState([]);
    const [fbiWanted,    setFbiWanted]    = useState([]);
    const [fbiCivilians, setFbiCivilians] = useState([]);
    const [fbiDuty,      setFbiDuty]      = useState([]);
    const [fbiMarkers,   setFbiMarkers]   = useState([]);
    const [activityLog,  setActivityLog]  = useState([]);

    useEffect(() => {
        if (!window.fbTools) return;
        const db = window.fbDB, T = window.fbTools;
        const subs = [
            T.onSnapshot(T.collection(db,'fbi_users'),      s => setFbiUsers(s.docs.map(d=>({...d.data(),id:d.id})))),
            T.onSnapshot(T.query(T.collection(db,'fbi_cases'),   T.orderBy('createdAt','desc')), s => setFbicases(s.docs.map(d=>({...d.data(),id:d.id})))),
            T.onSnapshot(T.collection(db,'fbi_wanted'),     s => setFbiWanted(s.docs.map(d=>({...d.data(),id:d.id})))),
            T.onSnapshot(T.collection(db,'fbi_civilians'),  s => setFbiCivilians(s.docs.map(d=>({...d.data(),id:d.id})))),
            T.onSnapshot(T.collection(db,'fbi_duty'),       s => setFbiDuty(s.docs.map(d=>({...d.data(),id:d.id})))),
            T.onSnapshot(T.collection(db,'fbi_markers'),    s => setFbiMarkers(s.docs.map(d=>({...d.data(),id:d.id})))),
        ];
        return () => subs.forEach(u => u());
    }, []);

    const addLog = useCallback((action) => {
        const now = new Date();
        setActivityLog(prev => [{
            time: now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),
            action, user: currentUser?.name||'SYSTEM', sector: currentUser?.sector||'—'
        }, ...prev].slice(0,60));
    }, [currentUser]);

    /* ── LOGIN ── */
    const doLogin = async () => {
        const email = document.getElementById('auth_email')?.value?.trim();
        const pass  = document.getElementById('auth_pass')?.value?.trim();
        if (!email || !pass) { setLoginError('ENTER CREDENTIALS'); return; }

        const sector = getSector(email);
        if (!sector) { setLoginError('INVALID EMAIL DOMAIN — USE @fbi.gov'); return; }

        setLoginError(''); setLoginLoading(true);

        await new Promise(r => setTimeout(r, 900));

        // Hardcoded admin
        if (sector === 'fbi' && email === 'vv@fbi.gov' && pass === 'vv11') {
            const u = { name:'System Administrator', rank:'Director', access:'command', id:'vv@fbi.gov', sector:'fbi' };
            setCurrentUser(u); setScreen('fbi'); setLoginLoading(false);
            setTimeout(() => addLog('Authenticated — Director access granted'), 200);
            return;
        }

        // Firestore lookup
        const col = fbiUsers;
        const match = col.find(u => u.id === email && u.password === pass);
        if (match) {
            const u = { ...match, sector };
            setCurrentUser(u); setScreen(sector); setLoginLoading(false);
            setTimeout(() => addLog(`Authenticated — ${match.rank}`), 200);
        } else {
            setLoginError('ACCESS DENIED — INVALID CREDENTIALS'); setLoginLoading(false);
        }
    };

    const doLogout = () => {
        addLog('Session terminated');
        setCurrentUser(null); setScreen('home');
    };

    /* ── shared data bundles ── */
    const fbiData = { users:fbiUsers, cases:fbiCases, wanted:fbiWanted, civilians:fbiCivilians, duty:fbiDuty, markers:fbiMarkers };

    /* ── SCREENS ── */
    if (screen === 'home')  return <HomeScreen  onLogin={() => setScreen('login')} />;
    if (screen === 'login') return <LoginScreen onBack={() => setScreen('home')} onLogin={doLogin} error={loginError} loading={loginLoading} setError={setLoginError} setLoginSector={setLoginSector} loginSector={loginSector}/>;
    if (screen === 'fbi')   return <SectorApp sector="fbi"  currentUser={currentUser} onLogout={doLogout} data={fbiData} activityLog={activityLog} addLog={addLog} ranks={FBI_RANKS}/>;
    return null;
};

/* ═══════════════════════════════════════════════════════
   HOME SCREEN
═══════════════════════════════════════════════════════ */
const HomeScreen = ({ onLogin }) => (
    <div className="fade-in" style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'auto'}}>
        {/* Gov banner */}
        <div style={{background:'#0e0d0a',color:'var(--text3)',padding:'6px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid var(--border2)'}}>
            <span className="mono" style={{fontSize:'0.6rem',letterSpacing:'0.15em'}}>OFFICIAL GOVERNMENT PORTAL — AUTHORIZED PERSONNEL ONLY</span>
            <span className="mono" style={{fontSize:'0.6rem',color:'var(--text3)'}}>{new Date().toUTCString()}</span>
        </div>

        {/* Hero */}
        <div className="gov-header" style={{flexShrink:0}}>
            <div style={{display:'flex',justifyContent:'center',marginBottom:32}}>
                <img src={FBI_LOGO} style={{width:72,height:72,filter:'brightness(0) invert(1)',opacity:.8}} alt="FBI"/>
            </div>
            <h1 className="display" style={{fontSize:'clamp(1.5rem,5vw,2.4rem)',letterSpacing:'0.06em',marginBottom:10,color:'var(--text)'}}>
                LAW ENFORCEMENT PORTAL
            </h1>
            <p className="mono" style={{color:'var(--text3)',fontSize:'0.7rem',letterSpacing:'0.2em',marginBottom:32}}>
                FEDERAL BUREAU OF INVESTIGATION — v2.0
            </p>
            <button className="btn btn-primary-fbi" style={{padding:'14px 40px',fontSize:'0.9rem',letterSpacing:'0.1em'}} onClick={onLogin}>
                <i className="fas fa-shield-halved"/>
                SECURE LOGIN
            </button>
        </div>

        {/* Sector */}
        <div style={{flex:1,padding:'32px 20px',maxWidth:420,margin:'0 auto',width:'100%'}}>
            <div className="sector-choice fbi-choice" onClick={onLogin}>
                <img src={FBI_LOGO} style={{width:56,height:56,margin:'0 auto 16px',display:'block',filter:'brightness(0) invert(1)',opacity:.85}} alt="FBI"/>
                <div className="display" style={{fontSize:'1.2rem',letterSpacing:'0.08em',color:'var(--fbi-light)',marginBottom:6}}>FBI</div>
                <p style={{fontSize:'0.75rem',color:'var(--text2)'}}>Federal Bureau of Investigation</p>
                <div style={{marginTop:12}}><span className="badge badge-fbi">@fbi.gov</span></div>
            </div>

/* ═══════════════════════════════════════════════════════
   SECTOR APP (FBI)
═══════════════════════════════════════════════════════ */
const SectorApp = ({ sector, currentUser, onLogout, data, activityLog, addLog, ranks }) => {
    const [activeTab, setActiveTab] = useState('dashboard');
    const [modal, setModal] = useState(null);
    const [editItem, setEditItem] = useState(null);
    const [search, setSearch] = useState('');

    const color  = 'var(--fbi)';
    const colorL = 'var(--fbi-light)';
    const logo   = FBI_LOGO;
    const label  = 'FBI';
    const prefix = sector; // collection prefix

    const isPrivileged = currentUser?.access === 'command' || isCommandRank(sector, currentUser?.rank);

    // helpers
    const openModal = (key, item=null) => { setModal(key); setEditItem(item); };
    const closeModal = () => { setModal(null); setEditItem(null); };

    const saveRecord = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data2 = Object.fromEntries(formData);
        const db = window.fbDB, T = window.fbTools;

        const colMap = {
            case_form:     `${prefix}_cases`,
            wanted_form:   `${prefix}_wanted`,
            civilian_form: `${prefix}_civilians`,
            staff_form:    `${prefix}_users`,
        };
        const col = colMap[modal];
        try {
            if (modal === 'civilian_form' && !editItem) {
                const dup = data.civilians.find(c => c.sonyId === data2.sonyId);
                if (dup) { alert(`ID ${data2.sonyId} is already registered to ${dup.name}`); return; }
            }
            if (editItem) {
                await T.updateDoc(T.doc(db, col, editItem.id), {...data2, lastModifiedBy: currentUser.name});
                addLog(`Record updated — ${col}`);
            } else {
                const rec = { ...data2, author: currentUser.name, authorRank: currentUser.rank, createdAt: T.serverTimestamp() };
                if (col.endsWith('_users')) await T.setDoc(T.doc(db, col, data2.id), rec);
                else await T.addDoc(T.collection(db, col), rec);
                addLog(`New record — ${col}`);
            }
            closeModal();
        } catch(err) { alert('Error: ' + err.message); }
    };

    const deleteRecord = async (col, id) => {
        if (!window.confirm('Confirm permanent deletion?')) return;
        await window.fbTools.deleteDoc(window.fbTools.doc(window.fbDB, col, id));
        addLog(`Deleted — ${col}`);
    };

    /* ── NAV items ── */
    const NAV = [
        { key:'dashboard', icon:'fa-grid-2',          label:'DASHBOARD' },
        { key:'cases',     icon:'fa-folder-open',      label:'CASES' },
        { key:'wanted',    icon:'fa-crosshairs',       label:'WANTED' },
        { key:'civilians', icon:'fa-fingerprint',      label:'CIVILIANS' },
        { key:'ops',       icon:'fa-map-location-dot', label:'OPS' },
        { key:'staff',     icon:'fa-user-gear',        label:'STAFF' },
        { key:'crypto',    icon:'fa-lock',             label:'CRYPTO' },
        { key:'logs',      icon:'fa-terminal',         label:'LOGS' },
    ];

    const activeClass = 'active-fbi';

    return (
        <div style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
            {/* Sector strip */}
            <div style={{height:3,background:color,flexShrink:0}}/>

            {/* Top bar */}
            <div className="topbar" style={{flexShrink:0}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <img src={logo} style={{width:28,height:28,objectFit:'contain'}} alt="logo"/>
                    <div>
                        <div className="display" style={{fontSize:'0.9rem',letterSpacing:'0.08em',color:color}}>{label} — {currentUser.name}</div>
                        <div className="mono" style={{fontSize:'0.55rem',color:'var(--text3)',letterSpacing:'0.1em'}}>{currentUser.rank}</div>
                    </div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                        <Dot status="green"/>
                        <span className="mono" style={{fontSize:'0.55rem',color:'var(--text3)'}}>ONLINE</span>
                    </div>
                    <button className="btn btn-outline btn-sm" onClick={onLogout} style={{color:'var(--danger)',borderColor:'rgba(164,55,47,0.4)'}}>
                        <i className="fas fa-right-from-bracket"/> Sign Out
                    </button>
                </div>
            </div>

            {/* Content */}
            <main style={{flex:1,overflowY:'auto',padding:'16px 14px 90px'}}>
                {activeTab === 'dashboard' && <DashboardTab sector={sector} data={data} color={color} isPrivileged={isPrivileged} openModal={openModal}/>}
                {activeTab === 'cases'     && <CasesTab     sector={sector} data={data} color={color} isPrivileged={isPrivileged} openModal={openModal} deleteRecord={deleteRecord} setEditItem={setEditItem} setModal={setModal}/>}
                {activeTab === 'wanted'    && <WantedTab    sector={sector} data={data} color={color} isPrivileged={isPrivileged} openModal={openModal} deleteRecord={deleteRecord}/>}
                {activeTab === 'civilians' && <CiviliansTab sector={sector} data={data} color={color} isPrivileged={isPrivileged} openModal={openModal} deleteRecord={deleteRecord} search={search} setSearch={setSearch} setModal={setModal} setEditItem={setEditItem}/>}
                {activeTab === 'ops'       && <OpsTab       sector={sector} data={data} color={color} currentUser={currentUser} addLog={addLog}/>}
                {activeTab === 'staff'     && <StaffTab     sector={sector} data={data} color={color} isPrivileged={isPrivileged} openModal={openModal} deleteRecord={deleteRecord} ranks={ranks}/>}
                {activeTab === 'crypto'    && <CryptoTab    color={color}/>}
                {activeTab === 'logs'      && <LogsTab      activityLog={activityLog} sector={sector}/>}
            </main>

            {/* Bottom nav */}
            <nav style={{position:'fixed',bottom:0,width:'100%',background:'var(--surface)',borderTop:'1px solid var(--border)',padding:'8px 4px 10px',display:'flex',justifyContent:'space-around',zIndex:200,boxShadow:'0 -2px 8px rgba(0,0,0,0.06)'}}>
                {NAV.map(n => (
                    <div key={n.key} className={`nav-tab ${activeTab===n.key ? activeClass : 'inactive'}`}
                        onClick={() => setActiveTab(n.key)}>
                        <i className={`fas ${n.icon}`}/>
                        <span>{n.label}</span>
                    </div>
                ))}
            </nav>

            {/* Modals */}
            {modal && (
                <RecordModal modal={modal} editItem={editItem} onClose={closeModal} onSave={saveRecord}
                    sector={sector} color={color} ranks={ranks} data={data}/>
            )}
        </div>
    );
};

/* ═══════════════════════════════════════════════════════

const OpsTab = ({ sector, data, color, currentUser, addLog }) => {
    const [isDeploying, setIsDeploying] = useState(false);
    const [selectedUnit, setSelectedUnit] = useState(null);
    const [mapLoaded, setMapLoaded] = useState(false);
    const [mapError, setMapError]   = useState(false);
    const mapUrl = MAP_URL_FBI;

    const db = window.fbDB, T = window.fbTools;
    const dutyCol    = `${sector}_duty`;
    const markerCol  = `${sector}_markers`;

    const toggleDuty = async () => {
        const on = data.duty.find(u => u.name === currentUser.name);
        if (!on) {
            await T.setDoc(T.doc(db, dutyCol, currentUser.name), { name: currentUser.name, rank: currentUser.rank, startTime: new Date().toISOString() });
        } else {
            await T.deleteDoc(T.doc(db, dutyCol, currentUser.name));
            await T.deleteDoc(T.doc(db, markerCol, currentUser.name));
        }
    };

    const handleMapClick = async (e) => {
        if (!isDeploying || !selectedUnit) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        await T.setDoc(T.doc(db, markerCol, selectedUnit.name), { name: selectedUnit.name, x, y });
        setIsDeploying(false); setSelectedUnit(null);
    };

    const isOnDuty = data.duty.find(u => u.name === currentUser.name);

    return (
        <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:12}}>
            <div className="display" style={{fontSize:'1.1rem',letterSpacing:'0.08em',color}}>OPS CENTER</div>

            <button className={`btn ${isOnDuty ? 'btn-danger' : 'btn-outline'}`} style={{width:'100%',padding:'12px'}} onClick={toggleDuty}>
                <i className={`fas ${isOnDuty ? 'fa-circle-stop' : 'fa-satellite-dish'}`}/>
                {isOnDuty ? 'LEAVE FIELD OPERATIONS' : 'JOIN FIELD OPERATIONS'}
            </button>

            {isDeploying && (
                <div className="alert alert-warning" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                        <p className="mono" style={{fontSize:'0.65rem',fontWeight:600}}><i className="fas fa-crosshairs" style={{marginRight:6}}/>DEPLOY MODE — TAP ON MAP</p>
                        <p style={{fontSize:'0.7rem',color:'var(--text2)',marginTop:2}}>Unit: {selectedUnit?.name}</p>
                    </div>
                    <button className="btn btn-outline btn-sm" style={{color:'var(--danger)',borderColor:'rgba(164,55,47,0.4)'}}
                        onClick={() => {setIsDeploying(false);setSelectedUnit(null);}}>Cancel</button>
                </div>
            )}

            {/* Map */}

/* ═══════════════════════════════════════════════════════
   CRYPTO TAB
═══════════════════════════════════════════════════════ */
const CryptoTab = ({ color }) => {
    const [raw, setRaw] = useState('');
    const [cipher, setCipher] = useState('');
    const [decInput, setDecInput] = useState('');
    const [decoded, setDecoded] = useState('');

    const encrypt = (text) => {
        if (!text) return '';
        try {
            const v = new TextEncoder().encode(text);
            let hex = Array.from(v).map(b=>b.toString(16).padStart(2,'0')).join('');
            const map = {'0':'X','1':'V','2':'I','3':'A','4':'B','5':'S','6':'T','7':'Z','8':'K','9':'P'};
            return hex.split('').map(c=>map[c]||c).join('·').toUpperCase();
        } catch(e) { return 'ERROR'; }
    };

    const decrypt = (c) => {
        if (!c) return '';
        try {
            const rev = {'X':'0','V':'1','I':'2','A':'3','B':'4','S':'5','T':'6','Z':'7','K':'8','P':'9'};
            const clean = c.split('·').map(ch=>rev[ch]||ch).join('').toLowerCase();
            const bytes = new Uint8Array(clean.match(/.{1,2}/g).map(b=>parseInt(b,16)));
            return new TextDecoder().decode(bytes);
        } catch(e) { return 'ERROR: Check cipher integrity'; }
    };

    return (
        <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:14}}>
            <div className="display" style={{fontSize:'1.1rem',letterSpacing:'0.08em',color}}>ENIGMA CRYPTO TERMINAL</div>

            <div className="card" style={{padding:20,borderTop:`3px solid ${color}`}}>
                <div className="display" style={{fontSize:'0.8rem',letterSpacing:'0.1em',color:'var(--text2)',marginBottom:14}}>ENCRYPTION UNIT</div>
                <FormField label="Plaintext Message">
                    <textarea className="input" style={{height:80}} placeholder="Type your message here..."
                        value={raw} onChange={e=>{setRaw(e.target.value);setCipher(encrypt(e.target.value));}}/>
                </FormField>
                {cipher && (
                    <div style={{marginTop:12,padding:12,background:'var(--surface2)',border:'1px dashed var(--border)',borderRadius:4}}>
                        <p className="label" style={{marginBottom:6}}>Generated Cipher:</p>
                        <p className="mono" style={{fontSize:'0.75rem',color:'var(--success)',wordBreak:'break-all',lineHeight:1.6}}>{cipher}</p>
                        <button className="btn btn-ghost btn-xs" style={{marginTop:8,color}} onClick={()=>navigator.clipboard.writeText(cipher)}>
                            <i className="fas fa-copy"/> Copy
                        </button>
                    </div>
                )}
            </div>

            <div className="card" style={{padding:20,borderTop:'3px solid var(--danger)'}}>
                <div className="display" style={{fontSize:'0.8rem',letterSpacing:'0.1em',color:'var(--text2)',marginBottom:14}}>DECRYPTION UNIT</div>
                <FormField label="Cipher Text">
                    <textarea className="input" style={{height:80}} placeholder="Paste cipher here..." value={decInput} onChange={e=>setDecInput(e.target.value)}/>
                </FormField>
                <button className="btn btn-outline" style={{width:'100%',marginTop:10,marginBottom:12,borderColor:color,color}} onClick={()=>setDecoded(decrypt(decInput))}>
                    <i className="fas fa-unlock"/> Decode Signal
                </button>
                {decoded && (
                    <div style={{padding:12,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:4}}>
                        <p className="label" style={{marginBottom:6}}>Decoded Message:</p>
                        <p style={{fontSize:'0.9rem',color:'var(--text)',lineHeight:1.6}}>{decoded}</p>
                    </div>
                )}
            </div>
        </div>
    );
};
